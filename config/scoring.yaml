# 七维加权。权重放这里不放代码：调权重是业务判断，不该改代码也不该改 schema。
#
# 拆成两组不是排版，是两种东西：llm 那四维是判断，det 那三维是事实。
# 判断可能错，事实不会 —— 所以 det 那组刻意不给高权重也不给低权重，
# 它们的作用是在两条 LLM 判断打平时把票投给「证据更多、更新、够得着」的那条。
#
# 现在这组数是拍的，没有标注支撑。Riley 标够 20-50 条之后要按她的判断反推，
# 见 b2b-outreach 那页的「A/B/C 阈值由 Riley 的标注反推，不是我定的」。
# 在那之前别拿几条个案来回调 —— 既调参又验证，得出的结论不作数。
weights:
  llm:
    icp_fit: 25          # 品类对不对。品类不对的一律低分，不管公司多大多有钱
    signal_strength: 20  # 事件有多硬。众筹刚结束 > 在招 NPI > 讲愿景
    seniority: 10        # 说话的人能不能拍板
    moq_fit: 15          # 反向维度，专门防「看着很对但注定谈不成」
  det:
    recency: 10          # 由 Signal.event_at 算，不是 observed_at
    reachability: 10     # 有没有 LinkedIn URL 或域名
    corroboration: 10    # 几件互相独立的事指向同一家公司

# 确定性维度的映射表。写成表不写成公式，是为了「为什么这条 recency 是 6 分」
# 随时能对着表回答，而不用去读一段插值代码。
deterministic:
  # 事件发生到现在过了几天 -> 分数。取第一条 max_age_days 满足的。
  recency_days:
    - {max_age_days: 3, score: 10}
    - {max_age_days: 7, score: 8}
    - {max_age_days: 14, score: 6}
    - {max_age_days: 30, score: 4}
    - {max_age_days: 90, score: 2}
    - {max_age_days: 3650, score: 0}

  # 几件独立的事 -> 分数。封顶是刻意的：第五件和第四件的边际信息很小，
  # 而不封顶会让一次联播（哪怕已经按 fact_hash 去过重）压过品类判断。
  corroboration_count:
    - {min_count: 4, score: 10}
    - {min_count: 3, score: 8}
    - {min_count: 2, score: 6}
    - {min_count: 1, score: 3}

  # 够不够得着。现在粒度很粗，enrich 拿到官网和具体联系人之后要细化。
  reachability:
    has_domain: 10        # 有官网域名，最容易接上
    has_linkedin_url: 6   # 只有 LinkedIn 公司页
    name_only: 2          # 只有公司名，得先人工找

llm:
  model: gpt-4o-mini
  # 显式给 schema，不靠 prompt 求它返回 JSON。
  # max_tokens 给够：踩过一次「输出被截断成半个 JSON、解析失败」的坑。
  max_tokens: 6000
  temperature: 0
  # 两种重问各有各的预算，不共用一个数。理由是它们性质不同：
  #
  #   content   引用是编的 / 一条引用都没给 / 分数越界 / analysis 空。
  #             这是预期内的失败，重问时把它编的原话带回去，多半一次就好。
  #             只重问不合格的那几家
  #   identity  答的公司集合对不上（漏答、多答、同一家答两次）。这是
  #             「不该发生」的失败，给 1 次是让偶发抖动能自愈；连着两次
  #             说明是系统性问题（prompt 太长、批太大、模型太弱），
  #             再重问也没用。整批重问
  #
  # 共用一个数的话，一次身份错会把本该留给引用的机会一起吃掉 ——
  # 身份重问成功之后才发现引用是编的，这时候预算已经空了。
  # 分开也不会让次数相乘：两个计数器各自单调递减、都不重置，
  # 所以一批最多调用 1 + identity_retries + content_retries = 3 次。
  content_retries: 1
  identity_retries: 1
  # 单次请求的超时，秒。超时是我们的，重试是 SDK 的：
  # openai 3.6 默认 read timeout 是 600 秒，14 批最坏能挂两个多小时，
  # 而这是个每天跑一次的定时任务，挂在那儿比失败更难发现。
  # 60 秒对一批 10 家足够宽（实测一次回答约 1.1k tokens）。
  # 重试次数和退避策略不在这里 —— 那是构造 client 时定的，
  # SDK 自己有（默认 max_retries=2，覆盖连接错误 / 408 / 409 / 429 / 5xx），
  # 我们再叠一层只会让重试次数相乘。
  request_timeout_seconds: 60
  # 一次请求判几家。analyze 按这个数自己分批，pipeline 不用管。
  #
  # 卡住的是输出不是输入：输入几十家也就几万 token，gpt-4o-mini 的窗口
  # 装得下；而每家的回答（company_key 加四个分数加一段 analysis 加引用）
  # 乘上家数很快就顶到 max_tokens。超了不是「答案短一点」，
  # 而是 JSON 被截断成半个、json.loads 报「少个花括号」、整批白跑 ——
  # 看着像模型抽风，实际是这两个数没算过。
  #
  # 所以这两个数是绑在一起的，改一个必须算另一个：
  #     batch_size * 每家的回答长度  必须明显小于  max_tokens
  #
  # analysis 从「一两句英文」改成「五到七句中文、逐维叙述」，再加一项
  # evidence_means（一两句中文）之后，每家的回答从约 110 tokens 涨到
  # 约 600：中文按 token 算比英文密（一个汉字常常一个多 token），
  # 句数也多了好几倍。
  # 6 家约 3600，max_tokens 给 6000 留了不小的余量 —— 余量要留够，
  # 因为超了不是「答案短一点」而是 JSON 被截断成半个、整批白跑。
  #
  # 批小了代价是请求次数多（固定开销 system 加 facts 每次都要重发一遍），
  # 但那笔钱远小于「整批白跑一次」。
  #
  # 定成 1：一次只判一家。几家拼在一条消息里时，模型是对着几家的帖子一起读的，
  # 前面几家的内容会带偏后面那家的判断 —— 一个媒体评测号单独判是 18 分（品类 0），
  # 跟别的五家拼在一批里判就是 46 到 64 分，还上了一次线索卡。
  # 打分本来就该一家一家独立判，同一家公司不该因为跟谁排在一批而换一个分数。
  # 多花的是每家都重发一遍 system 和 facts；gpt-4o-mini 这点钱不是这里要省的
  batch_size: 1

# 品类完全不对（icp_fit == 0）那一档的总分上限。
#
# 为什么要有这个数：icp_fit 的权重是它自己那一维的上限，不是别人的天花板。
# icp_fit 拿 0 分时，剩下六维加起来仍然能挣到 75 分 —— 而「事件很硬、说话人
# 是老板、MOQ 也合得上，只是做的东西跟我们无关」这种公司到处都有。也就是说
# 光靠权重压不住品类不对的过线，而不合格的绝对不放上来是头一条规矩。
#
# 这个数必须低于 discovery.yaml 里的 review_score：那一档是攒给 Riley 标注的
# 边界样本，品类不对的挤进去会浪费她的时间。两个数在两份配置里，
# trigger 读完配置那一步会当场查它们的大小关系。
#
# 取 30 不取 0：品类之外那几维照样算完再比大小，报表上还看得出这家
# 「除了品类之外有多硬」，排查「模型是不是把品类判错了」要靠这个。
off_category_cap: 30

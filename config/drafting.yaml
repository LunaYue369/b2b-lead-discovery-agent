# 写稿那张图自己的数和默认值。放这里不放代码：改的是业务判断。
#
# 跟 interactive.yaml（找公司那张图）分开放：两张图的模型调用性质不同，
# 找公司那边读的是「想找什么样的公司」，这边读的是「这一封要怎么写」，
# 以后写稿那一步的 max_tokens 会大得多，放一起的话调一处会连带另一处。

# plan_drafts 那一次调用：读用户说要写什么，再替每份定下没说的写法、卖点、开场
plan:
  # 一半是抄原话、从名单里挑编号，一半是替用户判断：推哪几样卖点、开场引哪条证据、写哪一种。
  # 后一半是判断不是抄写，用比 intent 那边大一档的模型。
  # 不用 gpt-5 那一档：它们是推理模型，不收 temperature=0，max_tokens 也要换成 max_completion_tokens，
  # 换它得连调用一起改
  model: gpt-4.1

  # 一份结果最多 4 份稿，每份十一个字段，里面有一句原话、一句理由。
  # AI 补的份也算在里面，给宽一点，防被截断成半个 JSON
  max_tokens: 2000

  # 0。同一段对话两次读出不一样的结果，会让「用户改了一个字，收件人全变了」这种事没法排查
  temperature: 0

  # 单次请求超时，秒。用户在 Slack 那头等着，挂着比失败更难受
  request_timeout_seconds: 30

  # 一轮最多写几份稿。写稿的钱、自审的次数、用户看稿的精力都跟份数成正比。
  # 用户一次说了更多的，按他说的顺序取前面这几份，计划里写一句
  max_drafts_per_round: 4

# classify_plan_reply 那一次调用：用户对着计划回的那句话，是要改、同意、还是不写了
reply:
  # 三选一的短判断，比定计划简单得多，用小模型
  model: gpt-4o-mini

  # 一个词加一句中文理由
  max_tokens: 200

  # 0。同一句话两次判出不同结果，「写」和「改」就要看运气
  temperature: 0

  # 单次请求超时，秒。用户刚回完话盯着屏幕，早点失败早点让他再说一次
  request_timeout_seconds: 15

# 用户没说的时候用什么。每一条用了默认的，计划里都会列给用户看（「你没说，按默认」）
defaults:
  # 对方在北美和欧洲的居多，帖子也都是英文的
  language: 英文
  tone: 简短、专业，不用推销腔

# write_draft 那一次调用：照计划写一份稿，一份调一次
write:
  # 写稿要文笔，用跟定计划同一档的模型。换 gpt-5 那一档要连调用一起改（同 plan 那段的说明）
  model: gpt-4.1

  # 一份文章 300 到 500 个词，邮件 150 个词以内，给宽一点防截断
  max_tokens: 1500

  # 比 0 高一点：用户说「再写一版」时，计划没变也该写出不一样的；高了又容易自己发挥数字
  temperature: 0.3

  # 单次请求超时，秒。一轮最多 4 份、一份一次，用户等的是几份加起来的时间
  request_timeout_seconds: 60

  # 代码检查（数字、附言长度、假装偶遇、称呼）不过关时最多重写几次。
  # 还不过就照样交出去，问题写在稿子下面让用户看
  max_retries: 2

  # LinkedIn 加好友附言的字符上限，LinkedIn 自己的限制
  note_limit: 300

# classify_feedback 那一次调用：用户看完稿子回的话，拆到每一份
feedback:
  # 要分清「动计划的话」和「动正文的话」、把「其他都行」展开到每一份，比三选一难，用大一档的模型
  model: gpt-4.1

  # 一轮最多 4 份，每份两句原话，加上新加的和一句理由
  max_tokens: 800

  # 0。同一句话两次拆出不一样的结果，「第 2 份」一会儿改一会儿定稿
  temperature: 0

  # 单次请求超时，秒
  request_timeout_seconds: 30

# 定时扫描（triggers/sweep_drafts.py）：停在看稿或看计划那一停太久没人回，还在等的稿记成 abandoned
sweep:
  # 几天没回算放弃。跟卡片沉默扫成 ignored 用同一个数
  abandon_after_days: 7

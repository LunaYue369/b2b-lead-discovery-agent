# interactive discovery 那张图自己的数。数字放这里不放代码：改的是业务判断。
#
# 跟 scoring.yaml 里那组 llm 参数刻意分开放，因为两者性质不同：
# 那组是 analyzer 的（每天一次、一批十家、六千 token、失败了明天再说），
# 这组是对话的（同事在 Slack 那头等着、一次几百 token、失败了他当场就看见）。
# 共用一份的话，给 analyzer 调大 max_tokens 会连带让每一句对话都变贵。

# understand_intent 那一次调用。
intent:
  # 跟 analyzer 用同一个模型。这一步比打分简单得多（读几句中文、填七个字段），
  # 没有理由更贵；真发现它读不懂中文口语，换之前先攒几条读错的实例。
  model: gpt-4o-mini

  # 一份 intent 实测约 200 tokens（七个字段加一句问题）。给到 800 是留给
  # 长一点的对话和长一点的 unsupported 原话。
  # analyzer 那边踩过一次「输出被截断成半个 JSON、解析失败」的坑，所以宁可给宽。
  max_tokens: 800

  # 0。同一段对话两次读出不一样的 intent，会让「同事改了一个字，方案全变了」
  # 这种事没法排查。
  temperature: 0

  # 单次请求超时，秒。超时是我们的、重试是 SDK 的：openai 默认 read timeout 是
  # 600 秒，而这条路上有人在等 —— 挂在那儿比失败更难受，失败至少还能再说一句。
  request_timeout_seconds: 30

  # 澄清最多问几轮。超了不再问，带着手上这份不完整的 intent 去拟方案。
  #
  # 3 的理由：我们后面还有 await_go 那道人拍板的闸门，所以问不出来不是死路。
  # 对同事来说「这版方案哪儿不对」比「你到底想找什么」好回答得多 —— 后者正是
  # 他答不上来，才会绕到第三轮。
  #
  # 这个数还兼一道保险：LangGraph 自己的 recursion_limit（默认 25 步）到点是抛
  # GraphRecursionError，那是炸不是收口，而且炸在同事已经认真回答了三四轮之后。
  max_clarify_rounds: 3

# plan_queries 那一次调用。拟词的那几个参数（model / max_tokens 等）2c-3 接真
# planner 时再加，现在只有确定性那一半要用的两个数。
planner:
  # 跟 intent 那次用同一个模型。拟词比读需求难一点，但难的地方在「用哪些词」，
  # 那是 prompt 里那几条实测经验在起作用，不是模型大小。真要换之前，先攒几条
  # 它拟得明显不对的词，拿同一份输入在两个模型上各跑一次比。
  model: gpt-4o-mini

  # 一版方案实测约 200 tokens（三条 query，每条一句检索式加一个旋钮）。
  # 给到 800 是留给长一点的检索式。
  # 这一步的输出里没有任何解释性的文字 —— 给用户看的那份清单是代码拼的，
  # 理由在 planner.build_assumptions 的 docstring 最后一节。
  max_tokens: 800

  # 0。同一份需求两次拟出不一样的词，会让「昨天那条词是怎么来的」没法回答。
  temperature: 0

  # 单次请求超时，秒。理由同 intent 那一段：超时是我们的、重试是 SDK 的。
  request_timeout_seconds: 30

  # 一次对话最多拟几条 query。
  #
  # 这个数同时是两件事：报价的上限，和给模型的指令（prompt 里那句「最多拟几条」
  # 从这里插值进去）。所以它只有这一处真相 —— 配置写 3、prompt 写 2 那种不一致
  # 没有任何症状。
  #
  # 3 的理由：一条约 0.08 美元（40 条 post），三条 0.24。后面还有 await_go 那道
  # 人拍板的闸门，所以宁可少拟让用户说「再加一条」，也不要一上来就拟满。
  # 它跟 scheduled 那边的 daily_query_budget 是两件事：那个是每天从库里挑几条跑。
  max_queries: 3

  # 每个计费 item 多少美元，用来报价。
  #
  # 实测出来的，不是供应商标价：run 36/37 是 80 个 item 花了 0.16，9-18 那次
  # NOT 实验是 90 个 item 花了 0.1801，两次都落在 0.002 上。
  # 标价会变，改它之前先去账单上对一次。
  unit_price_usd: 0.002

# classify_reply 那一次调用：用户对着方案回的那句话，是要改、要跑、还是不跑了。
reply:
  # 同一个模型。这一步是三选一的短判断，比读需求还简单。
  model: gpt-4o-mini

  # 一次输出只有一个词加一句中文理由，实测 60 tokens 以内。200 是给长一点的理由留的。
  max_tokens: 200

  # 0。同一句话两次判出不同结果，意味着「跑」这个动作是不是花钱要看运气。
  temperature: 0

  # 单次请求超时，秒。这一步是全流程里用户等得最不耐烦的一处 —— 他刚敲完
  # 「跑」，盯着屏幕。15 秒不回八成是那边出事了，早点失败早点让他再说一次。
  request_timeout_seconds: 15

# 月度上限。管两样钱：对话里说「跑」花出去的采集钱，和推卡之前找联系方式的钱（两条路都算）。
# 定时那一跑的采集不算：定时每天花多少是可预测的（每天固定几条 query），
# 对话那边一天问十次也可能，三天就能把整个月的采集预算烧光，而定时那一跑每天都要吃它。
#
# 已花 = 本账期里 interactive 那几跑的 query_executions.billed_item_count 之和 x
#        planner.unit_price_usd
#      + 本账期 actor_spend 的全部行（找联系方式，Apify 回的真扣费）
# 模型的钱不算，那几分钱不是这道闸要挡的东西。
#
# 闸门在花钱之前：已花 + 这次报价 > 上限就拒。采集那边是拒跑，方案留在原地；
# 找联系方式那边是不找付费的那一半，卡片照推。
budget:
  # 美元。Apify 那边是 STARTER 套餐：每月 19 美元、含 19 美元用量、硬上限也是 19
  # （GET /v2/users/me/limits 的 maxMonthlyUsageUsd）。19 管的是全部花费，这里管的少一样
  # （定时那一跑的采集），所以要给它和意外各留一份：
  #     定时那一跑    每天 2 条 query x 40 条 x 0.002 = 约 0.16，一个月约 4.8
  #     意外          约 1：手动试 actor、跑到一半崩溃回滚的那几跑（Apify 扣了，我们的账上没有）
  #     19 - 4.8 - 1 = 约 13
  # 定时那一跑还没部署的时候，这个数偏保守。改这个数不用改代码
  monthly_cap_usd: 13

  # 账期从每个月几号开始，跟 Apify 的账单对齐。GET /v2/users/me/limits 的 monthlyUsageCycle
  # 是 18 号零点到下个月 17 号（按 UTC），所以是 18。对不齐的话，账期交界那几天我们算的「已花」
  # 会比 Apify 早清零或晚清零，闸门在那几天就不准。
  # 只许 1 到 28：29 号以后有的月份没有这一天，账期的起点会算不出来
  billing_day: 18

# scheduled discovery 每天怎么组队。数字放这里不放代码：改的是业务判断。

# 今天最多跑几条 query。
#
# 定 2 是「管道还没跑通之前，多花的钱买不到信息」这个判断，不是成本上限
# 本身 —— 真正的上限在采集那一层（API 预算），这里只管条数。
#
# 换算过：实测 5 条 query 采到 191 条 post 约 0.38 美元，按这个比例
#     每天 2 条  约 4.6 美元/月   Apify 免费层 5 美元/月，刚好在里面
#     每天 3 条  约 6.8 美元/月   超免费层
#     每天 5 条  约 11.4 美元/月  立项时估的预算是 20 美元/月
# 撞上免费层上限时的症状是采集失败，不是「预算不够」，查起来要绕一圈，
# 所以宁可先小。等 Riley 开始标注、每天的线索真的不够看了，再往上调。
daily_query_budget: 2

# 三个池子分多少额度。三个数加起来必须是 1，selector 会当场检查 ——
# 和不为 1 会安静地改变实际跑的总量。
#
# 某个池子空的时候它那份额度会让给别人（今天 pinned 和 proven 都是空的，
# 全部额度落在 candidate 上）。让出去的规则在 selector 里，不在这里。
pool_ratios:
  pinned: 0.2
  proven: 0.6
  candidate: 0.2

# 每条 query 最多采几条。天花板不是地板：不够就返回少的，不要凑数。
# 它跟 daily_query_budget 一起决定这一跑花多少钱。
max_posts_per_query: 40

# 只要多新的帖子。合法值抄自 actor 的 postedLimit：
#   "" / 1h / 24h / week / month / 3months / 6months / year / any
# 空串在这里没有意义（它的意思是「没指定，用这个默认」），所以这里必须写一个真值。
#
# month 是从一开始就在用的那个值，改它之前先想清楚两头：窗口放宽会采回更多旧帖，
# 而 recency 那一维会把它们打低分 —— 花了采集的钱买回一批注定低分的东西。
# 窗口收窄省钱但会漏掉「上个月刚众筹完」那种正当线索。
#
# interactive 那条路上用户说了时间范围的话，用他说的，不用这个默认。
posted_within: month

# prefilter 的跨天记忆往回看几天。
#
# 定这个数的理由是语义不是存储：超过这些天还一模一样的正文再出现，
# 更可能是一件新事情，而不是同一轮联播的尾巴。窗口短一点反而更干净，
# 跨过窗口的那些交给下游按公司判冷却。
seen_days: 10

# 分数线。两个数都是临时值，等 Riley 标 20-50 条之后反推重定，
# 所以放配置不写死在代码里。
#
# qualified_score  过线就是「今天值得推给 Riley」，也是 query_executions
#                  里 qualified_lead_count 数的那条线。
# review_score     没过线但够得着的那一档，只落库不推卡片，
#                  用来给 Riley 攒标注样本 —— 推给她的要严，
#                  给她标的要有量，否则阈值永远校准不了。
qualified_score: 60
review_score: 40

# 分析完一家公司之后，多久之后才值得再花一次 LLM 的钱。
#
# 判据是「这家公司多久之后，世界可能变得不一样」，不是「它现在有多差」。
# 同样是低分，品类完全不对的和「品类对但今天只是发了句愿景」应该差很远，
# 后者下个月可能就众筹上线了。
#
# 刻意不用「有没有新证据」当放行判据：供应商发帖比买方勤得多，
# 按新证据放行等于把预算精确地送给发帖最勤的那批。
cooldown:
  # 过线的那一档。已经看过了，没有新事件的话短期内重看没有信息量。
  qualified_days: 30

  # 品类对、时机没到。这一档最该短，事件驱动的信号变化快。
  in_range_days: 14

  # 品类沾边、分数低。大概率是噪音，但没硬到能判终态。
  marginal_days: 60

  # icp_fit 到几分算「品类对」，用来分上面两档。
  in_range_icp_fit: 5

  # 退避上限。复查之后分数没提升就把冷却翻倍，翻到这里为止。
  max_days: 180

# proven 池怎么排名，以及一条 query 跑够几次才够格被那么评价。
#
# rank_score = qualified * (合格率的 Wilson 下界) + novel * (新公司率的下界)
# 下界的意思是「按目前这点数据，最保守能说它至少有多少」——
# 所以 1 个合格 / 1 次分析（裸比率 100%）算出来是 0.21，
# 而 40/100（裸比率 40%）是 0.31，样本少的自己沉下去。
query_ranking:
  # 跑够几次才够格被当成 proven 评价。硬闸门，不是参考值：
  # 下界压得住排名，压不住升级 —— 一条跑过两次、两次都撞上好线索的
  # query 在还很空的 proven 池里可能就是第一名，然后以 proven 的身份
  # 长期吃掉 60% 的采集预算，而支撑它的只有两次样本。
  #
  # 5 是临时值。按 cadence 1 天算是五天，按 7 天算是五周 ——
  # 存量类 query 攒够样本要一个多月，这个数以后可能要按 cadence 分档。
  min_executions: 5

  # Wilson 下界的置信水平，1.96 对应 95%。调大 = 更保守 = 更压小样本。
  wilson_z: 1.96

  # 两个分量的权重，加起来必须是 1（load_ranking_config 当场检查）。
  # 两个数是临时值，等 query_executions 攒够几周真实数据再重定。
  # 现在偏向 qualified，理由是「找到的公司值不值得联系」比「是不是新的」
  # 更接近最终目的；novel 拿 0.4 是因为没有它的话，一条天天重新发现
  # 同一批老公司的 query 看起来跟真正带来新线索的一样好。
  weights:
    qualified: 0.6
    novel: 0.4

# ── 推给 Riley 的那张早报 ──────────────────────────────────────────────
#
# 三档的分界跟上面那两个数共用一套刻度，刻意放在同一份配置里：
#     A 档   score >= a_score          最好的那几条，每天最多 a_quota 张
#     B 档   qualified_score 到 a_score  值得看，每天最多 b_quota 张
#     C 档   score < qualified_score    push_below_line 打开时也推（灰色条），关着只落库
# 分开放两份配置的话，改了「过线」而没改 B 档下界，就会出现
# 「过线了但不推」或者「没过线却推了」，而两处各自看都是对的。
delivery:
  # 没过线的也推成卡片（C 档），不截配额。
  #
  # 打开是实验期的临时做法：过线的卡片太少，每跑推出来零张的时候看不出这一跑到底抓到了
  # 什么。关掉就回到「只推过线的」。
  # 刻意不靠调低 qualified_score 来达到同样效果：那个数同时决定冷却期分档（过线那档
  # 冷却 30 天）和 query 排名里的 qualified_lead_count，调低它会让一批低分公司被当成
  # 过线的冷却 30 天、让 query 的合格率虚高。这个开关只管推不推卡片，别的一概不碰。
  push_below_line: true

  # A 档的下界。临时值，跟 qualified_score / review_score 一样要等
  # Riley 标 20-50 条反推 —— 现在没有任何人工标注，这个数是猜的。
  a_score: 75

  # 每天最多推几张。配额是天花板不是地板：不够就直说今天只有两条，
  # 绝不降标准凑数（写成下限会让系统在信号不够的日子自动放宽）。
  # 超了按分数截断，并且在早报里明示「另有 N 条因配额未推送」——
  # 静默丢掉的话，被砍掉的东西默认看不见。
  a_quota: 5
  b_quota: 10

  # 折叠区里放几条边界样本（review_score 到 qualified_score 那一档）。
  # 推给她的要严，给她标的要有量，否则阈值校准是个死锁。
  # 随机抽而不是取最高的几条：取最高的等于只给她看「差一点就过线」的，
  # 而那一档真正的用处是画出那条线到底在哪。
  review_sample_size: 5
